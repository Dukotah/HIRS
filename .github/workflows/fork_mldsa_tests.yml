# Fork-only workflow (Dukotah/HIRS, branch lane/pqc-mldsa): runs the HIRS_Utils crypto and COSE
# unit tests, including the ML-DSA (FIPS 204) tests. Not intended for upstream.
name: Fork ML-DSA Unit Tests

on:
  push:
    branches:
      - 'lane/pqc-mldsa'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  HIRS_Utils_crypto_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run HIRS_Utils crypto and COSE tests
        run: |
          ./gradlew --no-daemon :HIRS_Utils:test \
            --tests 'hirs.utils.crypto.*' \
            --tests 'hirs.utils.signature.cose.*' \
            :HIRS_Utils:checkstyleMain :HIRS_Utils:checkstyleTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIRS_Utils_test_report
          path: HIRS_Utils/build/reports/tests/test/
